<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hayal Panosu</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #fff5fc;
      color: #3d1a4d;
      margin: 0;
      padding: 2rem;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      font-size: 2.5rem;
      color: #8b2e7c;
    }

    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    button {
      background-color: #8b2e7c;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #6c1f61;
    }

    .dream-card {
      background-color: #fceeff;
      margin: 10px 0;
      padding: 12px;
      border-radius: 10px;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .delete-btn {
      background-color: #e75480;
      border: none;
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      margin-left: 10px;
      cursor: pointer;
    }

    #letterArea {
      display: none;
      margin-top: 15px;
    }

    footer {
      margin-top: 50px;
      font-size: 0.9rem;
      color: #777;
    }

    a {
      color: #8b2e7c;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hayal Panosu</h1>
    <input type="text" id="dreamInput" placeholder="Bir hayal kur...">
    <input type="date" id="dreamDate">
    <button onclick="addDream()">Hayali Ekle</button>

    <div id="dreamList"></div>

    <button onclick="toggleLetter()">📩 Kendime Mektup Yaz</button>
    <div id="letterArea">
      <textarea id="letterText" placeholder="Sevgili gelecekteki ben..."></textarea>
      <input type="date" id="letterDate">
      <button onclick="saveLetter()">Mektubu Kaydet</button>
    </div>

    <button onclick="downloadDreams()">📥 Hayallerimi İndir</button>

    <footer>
      💖 <a href="https://www.buymeacoffee.com/mavisoftstudios" target="_blank">Beni Destekle</a> <br/>
      © 2025 Mavi Soft Studios – Hayaller Gerçektir.
    </footer>
  </div>

  <script>
    let allDreams = [];

    function addDream() {
      const text = document.getElementById("dreamInput").value;
      const date = document.getElementById("dreamDate").value;
      if (text && date) {
        const div = document.createElement("div");
        div.className = "dream-card";

        const span = document.createElement("span");
        span.innerText = `${text} (${date})`;

        const delBtn = document.createElement("button");
        delBtn.className = "delete-btn";
        delBtn.innerText = "Sil";
        delBtn.onclick = () => {
          div.remove();
          allDreams = allDreams.filter(d => !(d.text === text && d.date === date));
        };

        div.appendChild(span);
        div.appendChild(delBtn);
        document.getElementById("dreamList").appendChild(div);

        allDreams.push({ text, date });
        document.getElementById("dreamInput").value = "";
        document.getElementById("dreamDate").value = "";
      }
    }

    function toggleLetter() {
      const area = document.getElementById("letterArea");
      area.style.display = area.style.display === "none" ? "block" : "none";
    }

    function saveLetter() {
      const metin = document.getElementById("letterText").value;
      const tarih = document.getElementById("letterDate").value;
      alert(`Mektubun kaydedildi 🎁 ${tarih} tarihinde seni bekliyor!`);
      document.getElementById("letterText").value = "";
      document.getElementById("letterDate").value = "";
      toggleLetter();
    }

    function downloadDreams() {
      if (allDreams.length === 0) {
        alert("Henüz kaydedilmiş bir hayalin yok.");
        return;
      }
      const blob = new Blob([JSON.stringify(allDreams, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "hayallerim.json";
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
